; CitizenTech · Monitor de Pavimento: firmware do ESP32 (PlatformIO)
;
; Compilar e gravar (com o ESP32 no USB):
;   pio run -t upload        ; ou o botão "Upload" da extensão PlatformIO no VS Code
;   pio device monitor       ; Serial Monitor a 115200 baud (aceita comandos: digite "ajuda")
;
; Antes de gravar: copie include/credenciais.exemplo.h para include/credenciais.h
; e preencha o Wi-Fi (2.4 GHz). O arquivo credenciais.h não vai para o Git.

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 115200 é mais lento, mas evita "Unable to verify flash chip connection" com cabos/conversores CP210x
upload_speed = 115200
monitor_echo = yes
monitor_filters = esp32_exception_decoder, send_on_enter
lib_deps =
    knolleary/PubSubClient@^2.8
    pololu/VL53L0X@^1.3.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
